<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 680 380" font-family="DejaVu Sans, sans-serif">
<rect width="680" height="380" fill="#ffffff"/>
<text x="340" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C2C2A">1. Who talks to whom: one job, two programs, three groups</text>
<rect x="40" y="40" width="600" height="320" rx="18" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="60" y="64" font-size="14" font-weight="bold" fill="#2C2C2A">MPI_COMM_WORLD  (everyone started by one mpirun)</text>
<text x="60" y="84" font-size="12" fill="#5F5E5A">mpirun -np 2 python3 yade-script.py  :  -np 2 foamSolver -parallel -mpi-split-by-appnum</text>
<rect x="70" y="100" width="250" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="195" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#085041">Yade / DEM  (MPI_APPNUM = 0)</text>
<text x="195" y="144" font-size="12" text-anchor="middle" fill="#0F6E56">own private group: mpy "comm"</text>
<circle cx="150" cy="190" r="24" fill="#9FE1CB" stroke="#0F6E56"/><text x="150" y="195" font-size="12" text-anchor="middle" fill="#04342C">rank 0</text>
<circle cx="240" cy="190" r="24" fill="#9FE1CB" stroke="#0F6E56"/><text x="240" y="195" font-size="12" text-anchor="middle" fill="#04342C">rank 1</text>
<rect x="360" y="100" width="250" height="140" rx="12" fill="#EEEDFE" stroke="#534AB7"/>
<text x="485" y="124" font-size="14" font-weight="bold" text-anchor="middle" fill="#3C3489">OpenFOAM  (MPI_APPNUM = 1)</text>
<text x="485" y="144" font-size="12" text-anchor="middle" fill="#534AB7">own private group: worldComm</text>
<circle cx="440" cy="190" r="24" fill="#CECBF6" stroke="#534AB7"/><text x="440" y="195" font-size="12" text-anchor="middle" fill="#26215C">rank 2</text>
<circle cx="530" cy="190" r="24" fill="#CECBF6" stroke="#534AB7"/><text x="530" y="195" font-size="12" text-anchor="middle" fill="#26215C">rank 3</text>
<rect x="70" y="262" width="540" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B"/>
<text x="340" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#633806">Bridge = a copy of MPI_COMM_WORLD (all 4 ranks)</text>
<text x="340" y="308" font-size="12" text-anchor="middle" fill="#854F0B">carries only coupling data; a "neighbour graph" on it says</text>
<text x="340" y="326" font-size="12" text-anchor="middle" fill="#854F0B">which DEM rank exchanges with which OpenFOAM rank</text>
</svg>
