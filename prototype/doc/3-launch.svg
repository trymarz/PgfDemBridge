<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="800" viewBox="0 0 680 400" font-family="DejaVu Sans, sans-serif">
<rect width="680" height="400" fill="#ffffff"/>
<text x="340" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C2C2A">3. Two ways to start the same 4 processes</text>
<rect x="30" y="44" width="300" height="320" rx="14" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="180" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#791F1F">A. Two programs (MPMD)</text>
<text x="50" y="98" font-size="11" fill="#791F1F" font-family="DejaVu Sans Mono, monospace">mpirun -np 2 python3 dem.py \</text>
<text x="50" y="114" font-size="11" fill="#791F1F" font-family="DejaVu Sans Mono, monospace">     : -np 2 foamSolver ...</text>
<text x="50" y="146" font-size="12" fill="#791F1F">mpirun starts 2 different programs.</text>
<text x="50" y="166" font-size="12" fill="#791F1F">Each gets MPI_APPNUM 0 or 1.</text>
<text x="50" y="200" font-size="12" font-weight="bold" fill="#791F1F">Problem:</text>
<text x="50" y="220" font-size="12" fill="#791F1F">Open MPI 5.0.7 on Debian 13 crashes</text>
<text x="50" y="238" font-size="12" fill="#791F1F">on the ":" before any process starts.</text>
<text x="50" y="256" font-size="12" fill="#791F1F">Needs PMIX_MCA_pmdl=^ompi hack.</text>
<text x="50" y="290" font-size="12" fill="#791F1F">Works on Open MPI 4.1 as is.</text>
<rect x="350" y="44" width="300" height="320" rx="14" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="500" y="70" font-size="14" font-weight="bold" text-anchor="middle" fill="#27500A">B. One program, two roles</text>
<text x="370" y="98" font-size="11" fill="#27500A" font-family="DejaVu Sans Mono, monospace">mpirun -np 4 pgf-role ...</text>
<text x="370" y="130" font-size="12" fill="#27500A">mpirun starts 4 copies of one tiny</text>
<text x="370" y="148" font-size="12" fill="#27500A">script. Each copy looks at its rank:</text>
<text x="370" y="170" font-size="12" fill="#27500A">  rank 0, 1  -> becomes Yade</text>
<text x="370" y="188" font-size="12" fill="#27500A">  rank 2, 3  -> becomes OpenFOAM</text>
<text x="370" y="222" font-size="12" fill="#27500A">Then the same split + bridge as A.</text>
<text x="370" y="256" font-size="12" fill="#27500A">No ":" -> no crash, no hack.</text>
<text x="370" y="274" font-size="12" fill="#27500A">Ran clean on Open MPI 5.0.7 (smoke).</text>
<text x="370" y="308" font-size="12" fill="#27500A">Cost: the script must read its rank</text>
<text x="370" y="326" font-size="12" fill="#27500A">from an env var that differs per MPI.</text>
</svg>
