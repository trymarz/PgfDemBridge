<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="860" viewBox="0 0 680 430" font-family="DejaVu Sans, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<text x="340" y="24" font-size="15" font-weight="bold" text-anchor="middle" fill="#2C2C2A">2. One coupling time step (time runs downward)</text>
<rect x="60" y="40" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56"/><text x="140" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#085041">Yade ranks</text>
<rect x="460" y="40" width="160" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="540" y="65" font-size="14" font-weight="bold" text-anchor="middle" fill="#3C3489">OpenFOAM ranks</text>
<line x1="140" y1="80" x2="140" y2="372" stroke="#888780" stroke-dasharray="4 4"/>
<line x1="540" y1="80" x2="540" y2="372" stroke="#888780" stroke-dasharray="4 4"/>
<text x="340" y="116" font-size="12" text-anchor="middle" fill="#2C2C2A">1. "I will send you N particles" (both ways)</text>
<line x1="146" y1="128" x2="534" y2="128" stroke="#444441" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="340" y="172" font-size="12" text-anchor="middle" fill="#2C2C2A">2. particle data: position, size, state</text>
<line x1="146" y1="184" x2="534" y2="184" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="420" y="208" width="240" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7"/><text x="540" y="235" font-size="12" text-anchor="middle" fill="#3C3489">3. fluid solve, per-particle results</text>
<text x="300" y="290" font-size="12" text-anchor="middle" fill="#2C2C2A">4. results back, same order, no ids</text>
<line x1="534" y1="302" x2="146" y2="302" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="346" font-size="12" text-anchor="middle" fill="#2C2C2A">5. time step dt + "DONE?" flag, sent by OpenFOAM rank 0</text>
<line x1="534" y1="358" x2="146" y2="358" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="398" font-size="12" text-anchor="middle" fill="#5F5E5A">Every arrow is a "collective": all ranks on both sides join it, so nobody waits alone.</text>
</svg>
